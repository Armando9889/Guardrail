<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img" aria-label="Logo Guardrail animato" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.cloudglow{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #3da8ff)}}
.orbit{stroke-dasharray:900;animation:orbit 4s ease-in-out infinite}
@keyframes orbit{0%{stroke-dashoffset:900;opacity:0}15%{opacity:1}60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-900;opacity:0}}
.led{animation:blink 1.6s steps(1) infinite}
.led.b{animation-delay:.5s}.led.c{animation-delay:1s}
@keyframes blink{50%{opacity:.15}}
.shield{transform-origin:350px 330px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.check{stroke-dasharray:120;animation:check 3s ease-in-out infinite}
@keyframes check{0%{stroke-dashoffset:120}30%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:120}}
.shine{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-260px)}80%,100%{transform:translateX(260px)}}
.word{opacity:0;animation:rise 1s .2s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.line{transform-origin:350px 495px;animation:grow 1.2s .6s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.node{animation:node 2s ease-in-out infinite}
@keyframes node{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs>
<radialGradient id="bg" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#0b2a5c"/><stop offset="1" stop-color="#06162f"/></radialGradient>
<linearGradient id="cl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5ff"/><stop offset="1" stop-color="#6f9be8"/></linearGradient>
<linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6fe0"/><stop offset="1" stop-color="#123c94"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a7be0"/><stop offset="1" stop-color="#0a3a96"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa4b8"/></linearGradient>
<linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fb2ff"/><stop offset="1" stop-color="#1b8cff"/></linearGradient>
<linearGradient id="orb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3fd0ff" stop-opacity="0"/><stop offset=".5" stop-color="#7fe3ff"/><stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/></linearGradient>
<clipPath id="sc"><path d="M350 150 L460 190 C460 280 430 340 350 390 C270 340 240 280 240 190 Z"/></clipPath>
</defs>

<rect width="700" height="560" rx="36" fill="url(#bg)"/>

<g class="float">
  <g class="cloudglow">
    <path d="M175 330 C120 330 100 265 150 245 C150 190 200 150 245 165 C265 105 340 70 405 90 C455 105 480 140 490 175 C545 180 575 235 545 280 C535 310 505 330 480 330 Z"
          fill="#0a2a66" stroke="url(#cl)" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M205 190 L255 172 L300 185 L300 225 L205 240 Z" fill="url(#sv)"/>
    <circle class="led" cx="222" cy="218" r="4" fill="#3de0ff"/><circle class="led b" cx="236" cy="218" r="4" fill="#3de0ff"/>
    <path d="M190 245 L240 232 L290 248 L290 300 L190 300 Z" fill="url(#sv)"/>
    <circle class="led c" cx="208" cy="272" r="4" fill="#3de0ff"/><circle class="led" cx="224" cy="272" r="4" fill="#3de0ff"/>
    <path d="M300 140 L350 128 L420 148 L420 215 L300 215 Z" fill="url(#sv)"/>
    <path d="M410 172 L470 190 L470 230 L410 245 Z" fill="url(#sv)"/>
    <circle class="led b" cx="458" cy="215" r="4" fill="#3de0ff"/>
    <path d="M450 250 L500 242 L500 305 L450 305 Z" fill="url(#sv)"/>
  </g>
  <g class="shield">
    <path d="M350 138 L470 182 C470 285 435 350 350 402 C265 350 230 285 230 182 Z" fill="url(#rim)"/>
    <path d="M350 160 L452 196 C452 282 422 338 350 383 C278 338 248 282 248 196 Z" fill="url(#sh)"/>
    <g clip-path="url(#sc)"><g class="shine"><rect x="330" y="120" width="40" height="300" fill="#fff" opacity=".16" transform="skewX(-18)"/></g></g>
    <path class="check" d="M300 270 L340 312 L402 240" fill="none" stroke="#f2f5fb" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M150 345 C260 385 470 340 560 240 C570 215 540 190 490 182" fill="none" stroke="#1fb2ff" stroke-opacity=".25" stroke-width="7" stroke-linecap="round"/>
  <path class="orbit" d="M150 345 C260 385 470 340 560 240 C570 215 540 190 490 182" fill="none" stroke="url(#orb)" stroke-width="9" stroke-linecap="round"/>
</g>

<g class="word" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="104" text-anchor="middle">
  <text x="350" y="470" letter-spacing="-3"><tspan fill="#e9eef7">Guard</tspan><tspan fill="url(#rail)">rail</tspan></text>
</g>
<rect class="line" x="90" y="494" width="220" height="3" fill="#1fb2ff" opacity=".7"/>
<rect class="line" x="390" y="494" width="220" height="3" fill="#1fb2ff" opacity=".7"/>
<rect class="node" x="332" y="480" width="36" height="30" rx="5" fill="none" stroke="#ff3b4e" stroke-width="7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
