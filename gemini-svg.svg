<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Sfondo (opzionale, utile per testare su sfondi scuri/chiari) -->
  <!-- <rect width="100%" height="100%" fill="white"/> -->

  <!-- Definizione Gradienti e Maschere -->
  <defs>
    <!-- Gradiente Principale OpenStack-style (Rosso/Arancio) -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e23e2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
    
    <!-- Maschera per l'effetto "scansione" sul testo -->
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="scanMask">
      <rect x="0" y="0" width="300" height="100" fill="url(#scanGradient)">
        <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 100" dur="3s" repeatCount="indefinite" />
      </rect>
    </mask>
  </defs>

  <!-- ICONA: Uno scudo stilizzato che "abbraccia" un'istanza -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Scudo Esterno (Sicurezza/Policy) -->
    <path d="M40,5 L10,20 L10,50 C10,70 25,85 40,90 C55,85 70,70 70,50 L70,20 L40,5 Z" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Animazione Pulsante dello Scudo -->
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Istanza/Server Interno (Rettangolo con 'ali' OpenStack) -->
    <g transform="translate(30, 35)">
        <rect x="0" y="0" width="20" height="30" rx="2" fill="url(#grad1)">
             <animate attributeName="fill-opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" />
        </rect>
        <path d="M-5,5 L0,10 L0,20 L-5,25 Z" fill="url(#grad1)" />
        <path d="M25,5 L20,10 L20,20 L25,25 Z" fill="url(#grad1)" />
    </g>
    
    <!-- Barra di scansione orizzontale sull'icona -->
    <line x1="15" y1="20" x2="65" y2="20" stroke="#f39c12" stroke-width="2" opacity="0.8">
        <animate attributeName="y1" values="20;80;20" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="20;80;20" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- TESTO: "Guardrail" -->
  <text x="90" y="65" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="bold" fill="#333">
    Guardrail
  </text>
  
  <!-- Testo duplicato con maschera per l'effetto "luce di scansione" -->
  <text x="90" y="65" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="bold" fill="url(#grad1)" mask="url(#scanMask)">
    Guardrail
  </text>

  <!-- Tagline/Sottotitolo -->
  <text x="92" y="85" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#7f8c8d">
    DevStack Compliance Plugin for Nova
  </text>

</svg>